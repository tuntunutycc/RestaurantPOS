<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Order History – POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-6">
  <div class="max-w-5xl mx-auto">
    <div id="pos-nav"></div>
    <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">Daily Order History</h1>
        <p class="text-sm text-slate-500">Paid orders for the selected day — Admin &amp; Cashier</p>
      </div>
      <div class="flex flex-wrap items-end gap-2">
        <div>
          <label for="history-date" class="block text-xs font-medium text-slate-600 mb-1">Date</label>
          <input type="date" id="history-date"
            class="px-3 py-2 border border-slate-300 rounded-md text-sm bg-white" />
        </div>
        <button type="button" id="btn-load-history"
          class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700">
          Load
        </button>
        <button type="button" id="btn-export-excel"
          class="px-4 py-2 bg-emerald-600 text-white text-sm font-medium rounded-md hover:bg-emerald-700">
          Export to Excel
        </button>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow border border-slate-200 overflow-hidden mb-4">
      <div class="px-4 py-3 border-b border-slate-100 flex flex-wrap gap-4 text-sm text-slate-600">
        <span>Orders: <strong id="history-order-count" class="text-slate-800">0</strong></span>
        <span>Grand total: <strong id="history-grand-total" class="text-slate-800">0</strong></span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-slate-700">
          <thead class="bg-slate-50 border-b border-slate-200">
            <tr>
              <th class="text-left px-4 py-2 font-semibold">Order ID</th>
              <th class="text-left px-4 py-2 font-semibold">Time</th>
              <th class="text-right px-4 py-2 font-semibold">Total Amount</th>
              <th class="text-right px-4 py-2 font-semibold">Actions</th>
            </tr>
          </thead>
          <tbody id="history-orders-body">
            <tr><td colspan="4" class="px-4 py-6 text-slate-500 text-center">Select a date and click Load.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="history-detail-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40">
    <div class="bg-white rounded-lg shadow-xl max-w-lg w-full max-h-[85vh] overflow-hidden flex flex-col">
      <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between gap-2">
        <h2 id="history-detail-title" class="text-lg font-semibold text-slate-800">Order details</h2>
        <button type="button" id="btn-close-history-detail"
          class="px-2 py-1 text-sm rounded border border-slate-300 hover:bg-slate-50">Close</button>
      </div>
      <div id="history-detail-body" class="p-4 overflow-y-auto text-sm text-slate-700 space-y-3"></div>
    </div>
  </div>

  <script src="/currency.js"></script>
  <script src="/i18n.js"></script>
  <script src="/toast.js"></script>
  <script src="/auth.js"></script>
  <script src="/order-history.js"></script>
</body>
</html>
