<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter / Admin – POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-6">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-2xl font-bold text-slate-800 mb-6">Counter / Admin</h1>

    <!-- Tab navigation -->
    <div class="flex border-b border-slate-200 mb-6">
      <button type="button" id="tab-cashier" class="tab-btn px-4 py-2 font-medium text-slate-700 border-b-2 border-blue-600 text-blue-600">
        Cashier / Billing
      </button>
      <button type="button" id="tab-menu" class="tab-btn px-4 py-2 font-medium text-slate-600 border-b-2 border-transparent hover:text-slate-800">
        Menu Management
      </button>
    </div>

    <!-- Tab 1: Cashier / Billing (table-centric) -->
    <div id="panel-cashier" class="tab-panel">
      <div class="grid md:grid-cols-3 gap-6">
        <!-- Tables list -->
        <div class="md:col-span-1">
          <h2 class="text-lg font-semibold text-slate-700 mb-3">Active Tables</h2>
          <p class="text-sm text-slate-500 mb-2">Tap a table to view its bill.</p>
          <ul id="orders-list" class="space-y-2">
            <li class="text-slate-500">Loading…</li>
          </ul>
        </div>
        <!-- Receipt: consolidated items + grand total for this table -->
        <div class="md:col-span-2">
          <div id="receipt-container" class="bg-white rounded-lg shadow p-6 hidden">
            <h2 class="text-lg font-semibold text-slate-700 mb-4">Receipt — Table <span id="receipt-table-number"></span></h2>
            <div id="receipt-content"></div>
            <p id="receipt-grand-total" class="text-lg font-semibold text-slate-800 border-t border-slate-200 pt-2 mt-2"></p>

            <div class="mt-4 space-y-3">
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Payment Method</label>
                <select id="payment-method" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                  <option value="cash">Cash</option>
                  <option value="mobile_money">Mobile Money</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Amount Tendered</label>
                <input
                  type="number"
                  id="amount-tendered"
                  min="0"
                  step="0.01"
                  class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                />
              </div>
              <p class="text-sm text-slate-700">
                Change (ပြန်အမ်းငွေ):
                <span id="change-amount" class="font-semibold">$0.00</span>
              </p>
              <button
                type="button"
                id="btn-process-payment"
                class="w-full py-3 bg-emerald-600 text-white font-medium rounded-md hover:bg-emerald-700"
              >
                Confirm Payment
              </button>
            </div>
          </div>
          <p id="receipt-placeholder" class="text-slate-500">Select a table on the left to view its consolidated order and grand total.</p>
        </div>
      </div>
    </div>

    <!-- Tab 2: Menu Management -->
    <div id="panel-menu" class="tab-panel hidden">
      <div class="grid md:grid-cols-2 gap-8 mb-10">
        <section class="bg-white rounded-lg shadow p-6">
          <h2 class="text-lg font-semibold text-slate-700 mb-4">Add Category</h2>
          <form id="form-category" class="space-y-3">
            <input type="text" id="category-name" name="name" placeholder="Category name" required
              class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
            <button type="submit" class="w-full py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700">Add Category</button>
          </form>
        </section>
        <section class="bg-white rounded-lg shadow p-6">
          <h2 class="text-lg font-semibold text-slate-700 mb-4">Add Menu Item</h2>
          <form id="form-menu-item" class="space-y-3">
            <input type="text" id="item-name" name="name" placeholder="Item name" required
              class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
            <input type="number" id="item-price" name="price" placeholder="Price" step="0.01" min="0" required
              class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
            <textarea id="item-description" name="description" placeholder="Description (optional)" rows="2"
              class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
            <select id="item-category" name="category_id" required
              class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
              <option value="">Select category</option>
            </select>
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1">Image (optional)</label>
              <div class="flex gap-2">
                <input type="text" id="item-image-url" name="image_url" placeholder="URL or upload below"
                  class="flex-1 px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                <label class="px-3 py-2 bg-slate-100 rounded-md cursor-pointer text-sm">Upload
                  <input type="file" id="item-image-file" accept="image/*" class="hidden" />
                </label>
              </div>
            </div>
            <button type="submit" id="btn-submit-menu-item" class="w-full py-2 bg-emerald-600 text-white font-medium rounded-md hover:bg-emerald-700">Add Menu Item</button>
          </form>
        </section>
      </div>
      <div class="grid md:grid-cols-2 gap-8">
        <section class="bg-white rounded-lg shadow p-6">
          <h2 class="text-lg font-semibold text-slate-700 mb-4">Categories</h2>
          <ul id="categories-list" class="space-y-2 text-slate-700">
            <li class="text-slate-500">Loading…</li>
          </ul>
        </section>
        <section class="bg-white rounded-lg shadow p-6">
          <h2 class="text-lg font-semibold text-slate-700 mb-4">Menu Items</h2>
          <ul id="menu-items-list" class="space-y-2 text-slate-700">
            <li class="text-slate-500">Loading…</li>
          </ul>
        </section>
      </div>
    </div>
  </div>

  <script src="/toast.js"></script>
  <script src="/counter.js"></script>
</body>
</html>
