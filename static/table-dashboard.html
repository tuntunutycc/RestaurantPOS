<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-6">
  <div class="max-w-7xl mx-auto">
    <div id="pos-nav"></div>
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-bold text-slate-800">Table Dashboard</h1>
      <button id="btn-refresh-grid" type="button" class="px-3 py-2 bg-slate-200 text-slate-800 rounded-md hover:bg-slate-300 text-sm">
        Refresh
      </button>
    </div>

    <div class="overflow-x-auto mb-4">
      <div id="zone-tabs" class="flex gap-2 min-w-max"></div>
    </div>

    <div id="tables-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
      <p class="col-span-full text-slate-500">Loading tables...</p>
    </div>

    <section class="mt-8">
      <h2 class="text-lg font-semibold text-slate-800 mb-3">🛍️ Active Walk-in Takeaways</h2>
      <div id="takeaway-orders-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
        <p class="col-span-full text-slate-500 text-sm">Loading takeaway orders...</p>
      </div>
    </section>
  </div>

  <!-- Order Sidebar -->
  <div id="order-sidebar-backdrop" class="fixed inset-0 bg-black/40 hidden z-40"></div>
  <aside id="order-sidebar" class="fixed top-0 right-0 h-full w-full sm:w-[420px] bg-white shadow-2xl transform translate-x-full transition-transform duration-200 z-50">
    <div class="h-full flex flex-col">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between">
        <div>
          <h2 class="text-lg font-semibold text-slate-800">Order Details</h2>
          <p id="sidebar-subtitle" class="text-sm text-slate-500">Table</p>
        </div>
        <button id="btn-close-sidebar" type="button" class="px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700">Close</button>
      </div>
      <div id="sidebar-content" class="flex-1 overflow-y-auto p-4 space-y-3">
        <p class="text-slate-500">Select an occupied table.</p>
      </div>
    </div>
  </aside>

  <script src="/auth.js"></script>
  <script src="/toast.js"></script>
  <script src="/i18n.js"></script>
  <script src="/currency.js"></script>
  <script src="/table-dashboard.js"></script>
</body>
</html>
