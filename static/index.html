<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS – Menu & Categories</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6">
  <div class="max-w-5xl mx-auto">
    <div id="pos-nav"></div>
    <h1 class="text-2xl font-bold text-slate-800 mb-8">Restaurant POS – Menu & Categories</h1>

    <div class="grid md:grid-cols-2 gap-8 mb-10">
      <!-- Add Category -->
      <section class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold text-slate-700 mb-4">Add Category</h2>
        <form id="form-category" class="space-y-3">
          <input
            type="text"
            id="category-name"
            name="name"
            placeholder="Category name"
            required
            class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          />
          <button type="submit" class="w-full py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700">
            Add Category
          </button>
        </form>
      </section>

      <!-- Add Menu Item -->
      <section class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold text-slate-700 mb-4">Add Menu Item</h2>
        <form id="form-menu-item" class="space-y-3">
          <input
            type="text"
            id="item-name"
            name="name"
            placeholder="Item name"
            required
            class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          />
          <input
            type="number"
            id="item-price"
            name="price"
            placeholder="Price"
            step="0.01"
            min="0"
            required
            class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          />
          <textarea id="item-description" name="description" placeholder="Description (optional)" rows="2"
            class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
          <select
            id="item-category"
            name="category_id"
            required
            class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          >
            <option value="">Select category</option>
          </select>
          <button type="submit" class="w-full py-2 bg-emerald-600 text-white font-medium rounded-md hover:bg-emerald-700">
            Add Menu Item
          </button>
        </form>
      </section>
    </div>

    <!-- Display areas -->
    <div class="grid md:grid-cols-2 gap-8">
      <section class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold text-slate-700 mb-4">Categories</h2>
        <ul id="categories-list" class="space-y-2 text-slate-700">
          <li class="text-slate-500">Loading…</li>
        </ul>
      </section>
      <section class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold text-slate-700 mb-4">Menu Items</h2>
        <ul id="menu-items-list" class="space-y-2 text-slate-700">
          <li class="text-slate-500">Loading…</li>
        </ul>
      </section>
    </div>
  </div>

  <script src="/auth.js"></script>
  <script src="/toast.js"></script>
  <script src="/i18n.js"></script>
  <script src="/currency.js"></script>
  <script src="/app.js"></script>
</body>
</html>
