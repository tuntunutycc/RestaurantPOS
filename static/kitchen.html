<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen Display – Pending Orders</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-6">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-xl md:text-2xl font-bold text-slate-800 mb-2">Kitchen Display</h1>
    <p class="text-slate-500 text-sm mb-6">Pending orders — live updates via WebSocket</p>

    <div id="tickets-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mb-8">
      <p class="col-span-full text-slate-500">Loading…</p>
    </div>

    <section class="mt-8">
      <h2 class="text-lg font-semibold text-slate-700 mb-2">Menu (live)</h2>
      <ul id="kitchen-menu-list" class="flex flex-wrap gap-2">
        <li class="text-slate-500">Loading…</li>
      </ul>
    </section>
  </div>

  <script src="/kitchen.js"></script>
</body>
</html>
