<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS – Root Setup</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="bg-white rounded-xl shadow-lg p-6">
      <h1 class="text-xl font-bold text-slate-800 text-center mb-2">Restaurant POS</h1>
      <p class="text-slate-500 text-sm text-center mb-6">Create the root account (one-time setup)</p>
      <div id="setup-error" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg"></div>
      <form id="setup-form" class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
          <input type="text" id="username" required class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" id="password" required minlength="6" class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
        </div>
        <button type="submit" id="setup-submit" class="w-full py-2.5 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700">Create root account</button>
      </form>
    </div>
  </div>
  <script src="/device.js"></script>
  <script src="/auth.js"></script>
  <script src="/setup.js"></script>
</body>
</html>
