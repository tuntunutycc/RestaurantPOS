<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS – Staff PIN Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .pin-dot { transition: transform 0.15s ease, background-color 0.15s ease; }
    .pin-dots.shake { animation: pin-shake 0.4s ease-in-out; }
    @keyframes pin-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .numpad-btn { touch-action: manipulation; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-xs">
    <div class="bg-white rounded-2xl shadow-xl p-6">
      <h1 class="text-lg font-bold text-slate-800 text-center mb-1">Staff Login</h1>
      <p class="text-slate-500 text-sm text-center mb-6">Enter your 4-digit PIN</p>

      <!-- 4 dots (filled as user types) -->
      <div id="pin-dots" class="pin-dots flex justify-center gap-3 mb-8">
        <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-300 bg-transparent" data-index="0"></span>
        <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-300 bg-transparent" data-index="1"></span>
        <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-300 bg-transparent" data-index="2"></span>
        <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-300 bg-transparent" data-index="3"></span>
      </div>

      <div id="pin-error" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm text-center rounded-lg">Wrong PIN</div>

      <!-- Numpad -->
      <div class="grid grid-cols-3 gap-2">
        <button type="button" class="numpad-btn h-14 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-semibold text-xl" data-digit="1">1</button>
        <button type="button" class="numpad-btn h-14 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-semibold text-xl" data-digit="2">2</button>
        <button type="button" class="numpad-btn h-14 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-semibold text-xl" data-digit="3">3</button>
        <button type="button" class="numpad-btn h-14 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-semibold text-xl" data-digit="4">4</button>
        <button type="button" class="numpad-btn h-14 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-semibold text-xl" data-digit="5">5</button>
        <button type="button" class="numpad-btn h-14 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-semibold text-xl" data-digit="6">6</button>
        <button type="button" class="numpad-btn h-14 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-semibold text-xl" data-digit="7">7</button>
        <button type="button" class="numpad-btn h-14 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-semibold text-xl" data-digit="8">8</button>
        <button type="button" class="numpad-btn h-14 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-semibold text-xl" data-digit="9">9</button>
        <button type="button" class="numpad-btn h-14 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-semibold text-xl col-span-2" id="btn-clear">Clear</button>
        <button type="button" class="numpad-btn h-14 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-semibold text-xl" data-digit="0">0</button>
        <button type="button" class="numpad-btn h-14 rounded-xl bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-700 font-semibold text-lg flex items-center justify-center" id="btn-back">⌫</button>
      </div>

      <p class="text-center mt-6">
        <a href="/login" class="text-sm text-slate-500 hover:text-slate-700">Admin login (username &amp; password)</a>
      </p>
    </div>
  </div>
  <script src="/auth.js"></script>
  <script src="/toast.js"></script>
  <script src="/pin-login.js"></script>
</body>
</html>
