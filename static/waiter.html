<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waiter POS – Take Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-6">
  <div class="max-w-6xl mx-auto">
    <div id="pos-nav"></div>
    <h1 class="text-xl md:text-2xl font-bold text-slate-800 mb-4">Waiter POS – Take Order</h1>

    <div class="grid md:grid-cols-2 gap-4 md:gap-6">
      <!-- Menu: sticky category tabs + grid -->
      <div>
        <h2 class="text-lg font-semibold text-slate-700 mb-3">Menu</h2>
        <!-- Sticky category tab bar -->
        <div class="sticky top-0 z-10 bg-slate-50 pb-2 -mx-1 mb-3 overflow-x-auto">
          <div id="category-tabs" class="flex gap-1 min-w-max">
            <!-- All / အားလုံး and category tabs rendered by JS -->
          </div>
        </div>
        <div id="menu-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-2 md:gap-3">
          <p class="col-span-full text-slate-500">Loading menu…</p>
        </div>

        <div class="mt-6 bg-white rounded-lg shadow p-4">
          <h2 class="text-lg font-semibold text-slate-700 mb-3">My Tables</h2>
          <div id="my-tables" class="space-y-3 text-sm text-slate-700">
            <p class="text-slate-500">Loading your active tables...</p>
          </div>
        </div>
      </div>

      <!-- Cart -->
      <div>
        <div class="bg-white rounded-lg shadow p-4 sticky top-4">
          <h2 class="text-lg font-semibold text-slate-700 mb-3">Cart</h2>
          <ul id="cart-list" class="space-y-2 mb-4 min-h-[80px] text-slate-700 text-sm">
            <li class="text-slate-500">Cart is empty</li>
          </ul>
          <div class="border-t border-slate-200 pt-3 mb-4">
            <div class="flex justify-between text-base font-semibold text-slate-800">
              <span>Total</span>
              <span id="cart-total">$0.00</span>
            </div>
          </div>
          <h3 class="text-sm font-semibold text-slate-700 mb-2">Zone & Table Selection</h3>
          <div class="mb-3 overflow-x-auto">
            <div id="zone-tabs" class="flex gap-1 min-w-max"></div>
          </div>
          <div id="table-cards" class="grid grid-cols-2 gap-2 mb-3">
            <p class="col-span-full text-slate-500">Loading tables…</p>
          </div>
          <div id="selected-table-label" class="text-sm text-slate-600 mb-4">
            Selected: <span class="font-medium">None</span>
          </div>
          <button
            id="submit-order"
            disabled
            class="w-full py-3 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Submit Order
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Table Details Sidebar -->
  <div id="waiter-table-details-backdrop" class="fixed inset-0 bg-black/40 hidden z-40"></div>
  <aside id="waiter-table-details-sidebar" class="fixed top-0 right-0 h-full w-full sm:w-[420px] bg-white shadow-2xl transform translate-x-full transition-transform duration-200 z-50">
    <div class="h-full flex flex-col">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between">
        <div>
          <h2 class="text-lg font-semibold text-slate-800">Table Details</h2>
          <p id="waiter-table-details-subtitle" class="text-sm text-slate-500">Table</p>
        </div>
        <button id="waiter-table-details-close" type="button" class="px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700">Close</button>
      </div>
      <div id="waiter-table-details-content" class="flex-1 overflow-y-auto p-4 space-y-3">
        <p class="text-slate-500">Select an occupied table.</p>
      </div>
    </div>
  </aside>

  <script src="/auth.js"></script>
  <script src="/toast.js"></script>
  <script src="/waiter.js"></script>
</body>
</html>
