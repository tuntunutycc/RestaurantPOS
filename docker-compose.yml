services:
  pos:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides .env so the container never uses the host's ./pos.db path.
      DATABASE_URL: sqlite:////data/db/pos.db
      POS_DB_PATH: /data/db/pos.db
      KITCHEN_PRINT_OUTPUT_DIR: /data/tickets
    volumes:
      # Named volumes, not Windows bind mounts. SQLite and ticket files stay
      # inside the Docker VM filesystem, which avoids WSL2 lock corruption.
      - pos_data:/data/db
      - pos_tickets:/data/tickets
    networks:
      - default
    restart: unless-stopped

volumes:
  pos_data:
  pos_tickets:

# Default bridge. Outbound TCP to LAN printers (for example 192.168.1.101:9100)
# is allowed. Docker Desktop on Windows does not support host networking.
networks:
  default:
    driver: bridge
